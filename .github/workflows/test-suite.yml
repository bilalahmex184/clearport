name: ClearPort Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # P6: The compiler and linter now gate the build. This is the guard that
      # would have caught the P1 (.catch on raw query builder), P2 (logRulesUpdate
      # signature mismatch), and P5 (Zod .errors vs .issues) bugs before they
      # shipped. Runs BEFORE build so a type error fails fast.
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: bun run lint

      - name: Run pure unit tests (no network required)
        run: bun run test:pure

      - name: (§6.3) Schema drift check — schema.sql must reference org-scoped policies
        run: |
          COUNT=$(grep -c "org_scoped" supabase/schema.sql || echo "0")
          if [ "$COUNT" -eq "0" ]; then
            echo "FAIL: supabase/schema.sql does not contain org_scoped policies — schema drift detected"
            exit 1
          fi
          echo "OK: schema.sql contains $COUNT org_scoped references"

      - name: Build project
        run: NODE_OPTIONS="--max-old-space-size=4096" bun run build
        env:
          DATABASE_URL: file:/tmp/test.db

      - name: Start production server
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
          NODE_OPTIONS="--max-old-space-size=2048" npx next start -p 3000 &
          sleep 10
          curl -s -o /dev/null -w "Server: %{http_code}\n" http://localhost:3000

      - name: Run security tests (Section 1)
        run: npx vitest run tests/unit/01-security.test.ts --reporter=verbose

      - name: Run document workflow tests (Section 2)
        run: npx vitest run tests/unit/02-document-workflow.test.ts --reporter=verbose

      - name: Run broker mapping tests (Section 3)
        run: npx vitest run tests/unit/03-broker-mapping.test.ts --reporter=verbose

      - name: Run invite/team tests (Section 4)
        run: npx vitest run tests/unit/04-invite-team.test.ts --reporter=verbose

      - name: Run performance tests (Section 5)
        run: npx vitest run tests/unit/05-performance.test.ts --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
